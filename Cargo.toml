[package]
name = "botw-save-manager-for-mac"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "Command-line Breath of the Wild save converter between Wii U and Switch, built for macOS"
repository = "https://github.com/Jeasin/BotW-Save-Manager-for-Mac"
publish = false

[lib]
name = "bsmm"
path = "src/lib.rs"

[[bin]]
name = "bsmm"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
